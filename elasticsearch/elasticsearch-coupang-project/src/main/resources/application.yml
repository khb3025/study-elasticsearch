spring:
  datasource:
    url: jdbc:mysql://localhost:3325/coupang
    username: elastic
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  elasticsearch:
    uris: http://localhost:9200

logging:
  level:
    org.elasticsearch.client: TRACE
    co.elastic.clients: TRACE
    org.apache.hc.client5.http.wire: TRACE
    org.apache.hc.client5.http.headers: TRACE