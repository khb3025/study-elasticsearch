services:
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5 # Elastic 9.4.5 (spring-data-elasticsearch 클라이언트 버전과 일치)
    ports:
    - 9200:9200 # 9200
    environment:
    # 아래 설정은 개발/테스트용 설정으로 실제 운영에서는 설정하면 안되는 옵션
    - discovery.type=single-node # 단일 노드
    - xpack.security.enabled=false # 보안 설정
    - xpack.security.http.ssl.enabled=false # 보안설정

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.5 # 9.4.5 버전 (Elasticsearch와 동일 버전 유지)
    ports:
      - 5601:5601 # 5601번 포트에서 kibana 실행
    environment:
      - ELASTICSEARCH_HOSTS=http://elastic:9200 # kibana가 통신할 Elasticsearch 주소 알려주기